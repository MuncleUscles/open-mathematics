name: Research adjudication
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      comment_id:
        description: ID of the PR author's signed claim comment (also resumes interrupted work)
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
  checks: write
concurrency:
  group: research-executor
  cancel-in-progress: false
jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && startsWith(github.event.comment.body, 'Open-Mathematics-Claim: '))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out trusted main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build pinned proof verifier
        run: bash github/build-verifier.sh
      - name: Verify, ask GenLayer, and execute finalized outcome
        run: node github/process-claim.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIER_SIGNING_KEY: ${{ secrets.VERIFIER_SIGNING_KEY }}
          EXECUTOR_SIGNING_KEY: ${{ secrets.EXECUTOR_SIGNING_KEY }}
