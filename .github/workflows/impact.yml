name: Later-impact reconciliation
on:
  workflow_dispatch:
    inputs:
      contribution_id:
        description: Already merged contribution ID (never resubmits or remerges a proof)
        required: true
        type: string
permissions:
  contents: write
jobs:
  process:
    if: github.ref == 'refs/heads/protocol'
    environment: protocol
    concurrency:
      group: research-executor
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: protocol
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify canonical merge and reconcile independent impact decision
        run: node github/process-impact.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTOR_SIGNING_KEY: ${{ secrets.EXECUTOR_SIGNING_KEY }}
